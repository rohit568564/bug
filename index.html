const downloadCSV = (data, filename) => {
    if (!data || !data.length) return;
    const headers = Object.keys(data[0]).join(',');
    const rows = data.map(obj =>
        Object.values(obj).map(v => `"${(v || '').toString().replace(/"/g, '""')}"`).join(',')
    ).join('\n');
    const blob = new Blob([`${headers}\n${rows}`], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.setAttribute("href", URL.createObjectURL(blob));
    link.setAttribute("download", filename);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
};

const formatCurrency = (amount) => {
  if (!amount) return 'N/A';
  const num = parseFloat(amount.toString().replace(/[^0-9.]/g, ''));
  if (isNaN(num)) return 'N/A';
  return '\u20B9' + num.toLocaleString('en-IN');
};

const downloadPDF = (record) => {

    const pageHeight = doc.internal.pageSize.getHeight();
    let y = 0;
    let pageNumber = 1;

    const safe = (v) => (v == null || v === "") ? "N/A" : String(v);

      if (!v) return 'N/A';
      const num = parseFloat(v.toString().replace(/[^0-9.]/g, ''));
      if (isNaN(num)) return 'N/A';
      return '\u20B9' + num.toLocaleString('en-IN');
    };

    // ===== PAGE HEADER =====
    const drawHeader = (isFirstPage) => {
      doc.setFillColor(15, 23, 42);
      doc.rect(0, 0, pageWidth, isFirstPage ? 32 : 14, 'F');
      doc.setTextColor(255, 255, 255);

      if (isFirstPage) {
        doc.setFontSize(22);
        doc.setFont(undefined, 'bold');
        doc.text("MyLoanCRM", 15, 16);
        doc.setFontSize(10);
        doc.setFont(undefined, 'normal');
        doc.text("Professional Loan Application Report", 15, 24);
        doc.setFontSize(9);
        doc.text("Generated: " + new Date().toLocaleString('en-IN'), pageWidth - 15, 12, { align: 'right' });

          'New': [59, 130, 246], 'Sanctioned': [16, 185, 129],
          'Disbursed': [20, 184, 166], 'Rejected': [239, 68, 68],
          'Completed': [16, 185, 129], 'Pending': [245, 158, 11]

        doc.setFillColor(...statusColor);
        doc.roundedRect(pageWidth - 55, 24, 40, 6, 1, 1, 'F');
        doc.setFontSize(7);
        doc.setFont(undefined, 'bold');
        doc.text((record.status || 'NEW').toUpperCase(), pageWidth - 35, 28, { align: 'center' });

        y = 40;
      } else {
        doc.setFontSize(9);
        doc.setFont(undefined, 'normal');
        doc.text("MyLoanCRM - " + safe(record.id) + " | Page " + pageNumber, 15, 10);
        y = 20;
      }
    };

    drawHeader(true);


    // ===== CUSTOMER HEADER SECTION =====
    doc.setTextColor(15, 23, 42);
    doc.setFontSize(18);
    doc.setFont(undefined, 'bold');
    doc.text(safe(record.name), 15, y);
    y += 7;
    doc.setFontSize(11);
    doc.setFont(undefined, 'normal');
    doc.setTextColor(71, 85, 105);
    doc.text(safe(record.loanType) + "  |  " + safe(record.mobile) + "  |  " + safe(record.email || ''), 15, y);
    y += 10;

    // Separator Line
    doc.setDrawColor(226, 232, 240);
    doc.setLineWidth(0.5);
    doc.line(15, y, pageWidth - 15, y);
    y += 10;

    // ===== CHECK PAGE OVERFLOW =====
    const checkPageBreak = (requiredSpace) => {
      if (y + requiredSpace > pageHeight - 30) {
        // Footer on current page
        doc.setFontSize(8);
        doc.setTextColor(148, 163, 184);
        doc.text("Page " + pageNumber + " | MyLoanCRM Professional Report", pageWidth / 2, pageHeight - 10, { align: 'center' });
        doc.addPage();
        pageNumber++;
        drawHeader(false);
        return true;
      }
      return false;
    };

    // ===== SECTION RENDERER =====
    const addSection = (title, fields, iconLabel) => {
      checkPageBreak(30);

      // Section Header with colored left border
      doc.setFillColor(248, 250, 252);
      doc.rect(12, y - 3, pageWidth - 24, 10, 'F');
      doc.setFillColor(79, 70, 229);
      doc.rect(12, y - 3, 3, 10, 'F');

      doc.setTextColor(15, 23, 42);
      doc.setFontSize(11);
      doc.setFont(undefined, 'bold');
      doc.text(title, 18, y + 3);
      y += 14;

      // Section Fields
      doc.setFont(undefined, 'normal');
      doc.setFontSize(10);

      fields.forEach(([label, value]) => {
        checkPageBreak(10);
        const safeValue = safe(value);

        // Label
        doc.setTextColor(100, 116, 139);
        doc.setFont(undefined, 'normal');
        doc.text(label, 20, y);

        // Value
        doc.setTextColor(15, 23, 42);
        doc.setFont(undefined, 'bold');

        // Handle long values with word wrap
        const maxValueWidth = pageWidth - 110;
        const splitValue = doc.splitTextToSize(safeValue, maxValueWidth);
        doc.text(splitValue, 90, y);

        y += (splitValue.length * 6) + 2;
      });

      y += 6;
    };


    // ===== PROCESS JOURNEY SECTION =====
    checkPageBreak(50);
    doc.setFillColor(15, 23, 42);
    doc.rect(12, y - 3, pageWidth - 24, 10, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(10);
    doc.setFont(undefined, 'bold');
    doc.text("APPLICATION JOURNEY", 18, y + 3);
    y += 16;

    const journeySteps = [];
    journeySteps.push({ step: "1. Enquiry Created", status: "Completed", date: safe(record.date) });
    if (record.financeDetails) journeySteps.push({ step: "2. Finance Processing", status: "Completed", date: "Processed" });
    if (record.sanctionDetails || record.status === 'Sanctioned') journeySteps.push({ step: "3. Loan Sanctioned", status: "Completed", date: "Approved" });
    if (record.disbursalDetails || record.status === 'Disbursed') journeySteps.push({ step: "4. Loan Disbursed", status: "Completed", date: safe(record.disbursalDetails?.disbursalDate) });
    if (record.rtoDetails) journeySteps.push({ step: "5. RTO / RC Process", status: record.rtoDetails.rcConfirmed ? "Confirmed" : "Pending", date: "Vehicle Loan" });
    if (record.paymentDetails) journeySteps.push({ step: "6. Payment Logged", status: "Active", date: new Date(record.paymentDetails.timestamp).toLocaleDateString() });
    if (record.status === 'Rejected') journeySteps.push({ step: "X. Application Rejected", status: "Declined", date: "System" });

    doc.setFontSize(9);
    journeySteps.forEach((step) => {
      checkPageBreak(10);
      const isDone = step.status === "Completed" || step.status === "Confirmed";
      const isRej = step.status === "Declined";

      // Step indicator dot
      if (isDone) doc.setFillColor(16, 185, 129);
      else if (isRej) doc.setFillColor(239, 68, 68);
      else doc.setFillColor(245, 158, 11);
      doc.circle(22, y - 1.5, 2.5, 'F');

      doc.setTextColor(15, 23, 42);
      doc.setFont(undefined, 'bold');
      doc.text(step.step, 28, y);

      doc.setFont(undefined, 'normal');
      doc.setTextColor(isDone ? 16 : isRej ? 239 : 100, isDone ? 185 : isRej ? 68 : 116, isDone ? 129 : isRej ? 68 : 139);
      doc.text(step.status, 120, y);

      doc.setTextColor(148, 163, 184);

    // ===== 1. BASIC LOAN DETAILS =====

    // ===== 4. VEHICLE DETAILS (Car Loan / CV Loan) =====

    // ===== 5. FINANCE / LENDER DETAILS =====

    // ===== 6. SANCTION DETAILS =====
    if (record.sanctionDetails) {
      addSection("6. SANCTION APPROVAL DETAILS", [
        ["Sanctioned Amount", safeAmount(record.sanctionDetails.sanctionedAmount)],
        ["Rate of Interest (ROI)", record.sanctionDetails.roi ? record.sanctionDetails.roi + "% p.a." : 'N/A'],
        ["Approved Tenure", record.sanctionDetails.tenure ? record.sanctionDetails.tenure + " Months" : 'N/A'],
        ["Monthly EMI", record.sanctionDetails.calculated?.emi ? safeAmount(record.sanctionDetails.calculated.emi) : 'N/A'],
        ["Processing / Doc Charges", record.sanctionDetails.docChargesAmount ? safeAmount(record.sanctionDetails.docChargesAmount) : 'N/A'],

      if (record.sanctionDetails.calculated?.emi) {

        doc.roundedRect(15, y, pageWidth - 30, 18, 3, 3, 'F');

        doc.setTextColor(6, 95, 70);
        doc.setFontSize(9);
        doc.setFont(undefined, 'bold');
        doc.text("MONTHLY EMI BREAKDOWN", 20, y + 6);
        doc.setFontSize(14);
        doc.text(safeAmount(record.sanctionDetails.calculated.emi) + " / month", 20, y + 13);
        doc.setFontSize(9);
        doc.setFont(undefined, 'normal');
        doc.text("for " + safe(record.sanctionDetails.tenure) + " months @ " + safe(record.sanctionDetails.roi) + "% ROI", 90, y + 13);

    // ===== 7. DISBURSAL DETAILS =====
    if (record.disbursalDetails) {
      addSection("7. DISBURSAL & SETTLEMENT", [

    if (record.paymentDetails) {
      addSection("8. PAYMENT / REPAYMENT LOG", [

        ["Amount Paid", safeAmount(record.paymentDetails.amount)],

    // ===== 9. RTO DETAILS =====
    if (record.rtoDetails) {
      addSection("9. RTO / RC DETAILS", [

    // ===== PROFESSIONAL FOOTER =====

// ===== AUTO CAR VALUATION ENGINE =====
const estimateCarValue = (company, model, variant, year, condition, rating, kms) => {
    let baseValue = 800000;
    const makeStr = (company || '').toLowerCase();
    const modelStr = (model || '').toLowerCase();
    const variantStr = (variant || '').toLowerCase();
    const y = parseInt(year) || 2020;
    const currentYear = new Date().getFullYear();
    const age = Math.max(0, currentYear - y);
    const k = parseInt((kms || '0').toString().replace(/,/g, '')) || 0;

    if (makeStr.includes('maruti') || makeStr.includes('suzuki')) {
        if (modelStr.includes('swift')) baseValue = 750000;
        else if (modelStr.includes('baleno')) baseValue = 900000;
        else if (modelStr.includes('brezza')) baseValue = 1150000;
        else baseValue = 700000;
    } else if (makeStr.includes('hyundai')) {
        if (modelStr.includes('creta')) baseValue = 1600000;
        else if (modelStr.includes('venue')) baseValue = 1100000;
        else if (modelStr.includes('i20')) baseValue = 950000;
        else baseValue = 900000;
    } else if (makeStr.includes('tata')) {
        if (modelStr.includes('nexon')) baseValue = 1100000;
        else if (modelStr.includes('punch')) baseValue = 850000;
        else if (modelStr.includes('harrier')) baseValue = 1950000;
        else baseValue = 1000000;
    } else if (makeStr.includes('mahindra')) {
        if (modelStr.includes('xuv700')) baseValue = 2300000;
        else if (modelStr.includes('scorpio')) baseValue = 1850000;
        else if (modelStr.includes('thar')) baseValue = 1750000;
        else baseValue = 1500000;
    } else if (makeStr.includes('toyota')) {
        if (modelStr.includes('fortuner')) baseValue = 4200000;
        else if (modelStr.includes('innova')) baseValue = 2700000;
        else baseValue = 2000000;
    } else if (makeStr.includes('kia')) {
        if (modelStr.includes('seltos')) baseValue = 1550000;
        else if (modelStr.includes('sonet')) baseValue = 1150000;
        else baseValue = 1300000;
    } else if (makeStr.includes('honda')) {
        if (modelStr.includes('city')) baseValue = 1450000;
        else baseValue = 1100000;
    }

    if (variantStr.includes('+') || variantStr.includes('plus') || variantStr.includes('top') || variantStr.includes('xza') || variantStr.includes('alpha')) baseValue *= 1.25;
    else if (variantStr.includes('mid') || variantStr.includes('vxi') || variantStr.includes('zeta')) baseValue *= 1.10;
    else if (variantStr.includes('base') || variantStr.includes('lxi') || variantStr.includes('sigma')) baseValue *= 0.90;

    let depreciationRate = 0;
    if (condition === 'Used Car' || age > 0) {
        if (age === 1) depreciationRate = 0.12;
        else if (age === 2) depreciationRate = 0.20;
        else if (age === 3) depreciationRate = 0.30;
        else if (age === 4) depreciationRate = 0.40;
        else if (age === 5) depreciationRate = 0.50;
        else if (age > 5) depreciationRate = 0.50 + ((age - 5) * 0.05);
    }

    const expectedKms = age * 12000;
    if (k > expectedKms) depreciationRate += Math.min(((k - expectedKms) / 10000) * 0.015, 0.10);
    else if (k > 0 && k < expectedKms) depreciationRate -= Math.min(((expectedKms - k) / 10000) * 0.01, 0.05);

    let conditionMod = 1.0;
    if (rating === 'Excellent') conditionMod = 1.05;
    else if (rating === 'Very Good') conditionMod = 1.02;
    else if (rating === 'Fair') conditionMod = 0.90;
    else if (rating === 'Bad') conditionMod = 0.75;

    const finalValue = baseValue * (1 - depreciationRate) * conditionMod;
    return { min: Math.round(finalValue * 0.95), max: Math.round(finalValue * 1.05) };
};

const getDynamicDocuments = (product, occupation) => {
  const loan = product || 'Personal Loan';
  const emp = occupation || 'Salaried';
  const isSalaried = emp.includes('Salaried');
  const isSelfEmployed = emp.includes('Self Employed') || emp.includes('Business');
  let docs = [];
  docs.push({ key: 'pan', name: 'PAN Card', category: 'KYC Documents', mandatory: true });
  docs.push({ key: 'aadhar', name: 'Aadhaar Card (Front & Back)', category: 'KYC Documents', mandatory: true });
  docs.push({ key: 'photo', name: 'Passport Size Photograph', category: 'KYC Documents', mandatory: false });

  if (isSalaried) {
    docs.push({ key: 'salary_slips', name: 'Latest 3 Months Salary Slips', category: 'Income Proof', mandatory: true });
    docs.push({ key: 'bank_statement_6m', name: '6 Month Bank Statement', category: 'Banking', mandatory: true });
  } else if (isSelfEmployed) {

  }
  return docs;
};

      case 'rejects':

      default:

        setSanctionRecord(null);
        setActiveModule('sanctions');

    // Disbursal Modal
    disbursalRecord && React.createElement(DisbursalModal, {
      record: disbursalRecord,
      onClose: () => setDisbursalRecord(null),
      onSave: (disbursalDetails) => {
        setEnquiries(enquiries.map(e => e.id === disbursalRecord.id ? { ...e, status: 'Disbursed', disbursalDetails } : e));
        setDisbursalRecord(null);
        setActiveModule('disbursals');
      }
    }),

    // Sidebar
    React.createElement('aside', { className: `bg-slate-900 text-slate-300 flex flex-col transition-all duration-300 z-30 ${sidebarOpen ? 'w-56' : 'w-16'} flex-shrink-0 shadow-xl hidden md:flex` },
      // Logo
      React.createElement('div', { className: "h-14 flex items-center px-4 border-b border-slate-800" },
        React.createElement('div', { className: "w-8 h-8 bg-gradient-to-br from-indigo-500 to-blue-600 rounded-lg flex items-center justify-center flex-shrink-0 shadow-lg" },

        sidebarOpen && React.createElement('span', { className: "ml-2.5 text-white font-black text-lg tracking-tight" }, "MyLoanCRM")
      ),
      // Nav Groups
      React.createElement('div', { className: "flex-1 overflow-y-auto scrollbar-hide py-4 px-2.5 space-y-5" },
        navGroups.map((group, gIdx) =>
          React.createElement('div', { key: gIdx },
            sidebarOpen && React.createElement('p', { className: "text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 px-1.5" }, group.title),
            React.createElement('nav', { className: "space-y-1" },
              group.items.map(item => {

                  onClick: () => setActiveModule(item.id),

      }, React.createElement(ChevronRight, { size: 14, className: `transition-transform ${sidebarOpen ? 'rotate-180' : ''}` }))
    ),

      // Top Header

        React.createElement('div', { className: "flex items-center gap-3" },

        ),

          React.createElement('button', {
            onClick: () => { downloadPDF(enquiries[0]); },

          }, React.createElement(Download, { size: 14 }), " Quick PDF Demo"),
          React.createElement('button', {
            onClick: () => setActiveModule('enquiries'),
            className: "bg-indigo-600 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold hover:bg-indigo-700 flex items-center gap-1.5 shadow-sm"
